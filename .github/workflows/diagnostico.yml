# Temporal: comprueba desde GitHub si las webs de los súper responden (fotos y fichas). Se borra después.
name: Diagnostico
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          for u in \
            "https://prod-mercadona.imgix.net/images/3b8cde7b3cb069ee0316029012cf8562.jpg?fit=crop&h=300&w=300" \
            "https://tienda.mercadona.es/api/products/3400/?lang=es&wh=vlc1" \
            "https://cdn-consum.aktiosdigitalservices.com/tol/consum/media/product/img/300x300/1669_001.jpg" \
            "https://cdn-consum.aktiosdigitalservices.com/tol/consum/media/product/img/1600x1600/1669_002.jpg" \
            "https://www.lidl.es/assets/gcp5dd129455b2c41ac9fef93bdc5ce8c51.png" ; do
            echo "$(curl -s -o /dev/null -m 20 -A "$UA" -w '%{http_code} %{time_total}s' "$u") $u"
          done
          echo "sin UA: $(curl -s -o /dev/null -m 20 -w '%{http_code} %{time_total}s' https://www.dia.es/api/v1/plp-back/reduced)"

<meta charset="utf-8">
<title>Comparador de supermercados</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1020" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de compra al estilo iOS. Móvil: una columna, barra de pestañas translúcida y barra flotante con tu compra.
   Escritorio (≥ 960 px): menú lateral, contenido central y panel «Tu compra» siempre a la vista.
   La etiqueta amarilla del lineal marca siempre lo más barato. */
:root {
  --fondo: #F2F3F7;            /* gris agrupado de iOS, con un punto azul */
  --tarjeta: #FFFFFF;
  --tinta: #161B33;            /* azul marino */
  --tinta-2: #5E6480;
  --tinta-3: #8A8FA8;
  --linea: rgba(22, 27, 51, .09);
  --relleno: #E8EAF1;          /* fondos de controles y chips */
  --primario: #161B33;
  --primario-tinta: #FFFFFF;
  --etiqueta: #FFD43B;         /* la etiqueta amarilla del lineal: «el más barato» */
  --etiqueta-tinta: #161B33;
  --sano: #157A4A; --sano-fondo: #E2F4EA;
  --cheque: #B4470A; --cheque-fondo: #FFF0E4;
  --oferta: #C81D57;
  --foco: #3355E0;
  --vidrio: rgba(242, 243, 247, .78);
  --sombra-1: 0 1px 2px rgba(22, 27, 51, .05), 0 1px 1px rgba(22, 27, 51, .03);
  --sombra-2: 0 1px 2px rgba(22, 27, 51, .06), 0 8px 24px rgba(22, 27, 51, .08);
  --sombra-3: 0 10px 40px rgba(22, 27, 51, .22);
  --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --texto: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
  --barra: 58px;
  --r-tarjeta: 22px; --r-control: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --fondo: #0E1020; --tarjeta: #191C30; --tinta: #F1F2F8; --tinta-2: #A9AEC7; --tinta-3: #7D829C;
  --linea: rgba(255, 255, 255, .08); --relleno: #262A42; --primario: #F1F2F8; --primario-tinta: #0E1020;
  --etiqueta: #FFD43B; --etiqueta-tinta: #161B33; --sano: #6FD39B; --sano-fondo: #153325; --cheque: #FFA366; --cheque-fondo: #3A2414;
  --oferta: #FF6E9C; --foco: #8EA3FF; --vidrio: rgba(14, 16, 32, .74);
  --sombra-1: 0 1px 2px rgba(0, 0, 0, .3); --sombra-2: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3); --sombra-3: 0 10px 40px rgba(0, 0, 0, .55);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --fondo: #0E1020; --tarjeta: #191C30; --tinta: #F1F2F8; --tinta-2: #A9AEC7; --tinta-3: #7D829C;
  --linea: rgba(255, 255, 255, .08); --relleno: #262A42; --primario: #F1F2F8; --primario-tinta: #0E1020;
  --etiqueta: #FFD43B; --etiqueta-tinta: #161B33; --sano: #6FD39B; --sano-fondo: #153325; --cheque: #FFA366; --cheque-fondo: #3A2414;
  --oferta: #FF6E9C; --foco: #8EA3FF; --vidrio: rgba(14, 16, 32, .74);
  --sombra-1: 0 1px 2px rgba(0, 0, 0, .3); --sombra-2: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3); --sombra-3: 0 10px 40px rgba(0, 0, 0, .55);
  color-scheme: dark }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
@media (pointer: fine) { html { overscroll-behavior: none; } }
body { background: var(--fondo); color: var(--tinta); font: 16px/1.42 var(--texto); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--fondo); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2.5px solid var(--foco); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.salto { position: absolute; left: 12px; top: -60px; z-index: 60; background: var(--primario); color: var(--primario-tinta); padding: 10px 14px; border-radius: 10px; }
.salto:focus { top: calc(env(safe-area-inset-top, 0px) + 8px); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; text-wrap: pretty; }

/* ---------- estructura ---------- */
.marco { min-height: 100%; }
.centro { width: 100%; max-width: 680px; margin: 0 auto; min-width: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--barra) + env(safe-area-inset-bottom, 0px) + 96px); }
.lateral, .panel { display: none; }
@media (min-width: 960px) {
  .marco { display: grid; grid-template-columns: 232px minmax(0, 1fr) 360px; gap: 0; max-width: 1360px; margin: 0 auto; }
  .lateral { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; padding: 28px 16px 24px 24px; }
  .panel { display: block; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 24px 24px 24px 8px; }
  .centro { max-width: 760px; padding-left: 24px; padding-right: 24px; padding-block: 0 48px; }
  .tabbar, .barra-compra { display: none !important; }
}

/* ---------- cabecera ---------- */
.cab { padding-top: 18px; display: grid; gap: 4px; }
.titulo-grande { font: 800 32px/1.05 var(--display); letter-spacing: -.02em; }
.cab .sub { color: var(--tinta-2); font-size: 14px; }
.buscador-wrap { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; margin-inline: -16px; padding: 10px 16px 10px;
  background: var(--vidrio); -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px); }
@media (min-width: 960px) { .buscador-wrap { margin-inline: -24px; padding-inline: 24px; } }
.buscador { position: relative; }
.buscador input { width: 100%; height: 48px; border-radius: 14px; border: 0; background: var(--tarjeta); box-shadow: var(--sombra-1), inset 0 0 0 1px var(--linea);
  padding: 0 46px; font-size: 17px; -webkit-appearance: none; appearance: none; }
.buscador input::placeholder { color: var(--tinta-3); }
.buscador input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.buscador .lupa { position: absolute; left: 15px; top: 14px; width: 20px; height: 20px; color: var(--tinta-3); pointer-events: none; }
.borrar { position: absolute; right: 4px; top: 4px; width: 40px; height: 40px; border: 0; background: none; border-radius: 10px; color: var(--tinta-3); display: grid; place-items: center; }

/* ---------- piezas comunes ---------- */
.logo { display: block; flex: none; border-radius: 22%; background: #fff; box-shadow: 0 0 0 1px rgba(22, 27, 51, .08); object-fit: contain; }
.tienda-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0; white-space: nowrap; }
.foto { flex: none; border-radius: 14px; background-color: #fff; background-repeat: no-repeat; }
.foto.vacia { display: grid; place-items: center; color: #9AA0B6; font-size: 11px; background: #fff; }
.tarjeta { background: var(--tarjeta); border-radius: var(--r-tarjeta); box-shadow: var(--sombra-1); }
.seccion { display: grid; gap: 12px; margin-top: 26px; min-width: 0; }
.seccion > * { min-width: 0; }
.seccion-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.h2 { font: 700 21px/1.2 var(--display); letter-spacing: -.01em; }
.h3 { font: 700 17px/1.25 var(--display); }
.sub { color: var(--tinta-2); font-size: 14px; }
.peq { font-size: 13px; color: var(--tinta-2); }
.enlace-btn { border: 0; background: none; padding: 0; color: var(--foco); font-weight: 600; font-size: inherit; min-height: 32px; }
@media (hover: hover) and (pointer: fine) { .enlace-btn:hover { text-decoration: underline; text-underline-offset: 3px; } }
.enlace { color: var(--foco); font-weight: 600; text-decoration: none; }
@media (hover: hover) and (pointer: fine) { .enlace:hover { text-decoration: underline; text-underline-offset: 3px; } }

/* botones */
.btn { height: 50px; padding: 0 20px; border-radius: 16px; border: 0; background: var(--primario); color: var(--primario-tinta); font-weight: 600; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: transform 140ms var(--ease-out), opacity 140ms ease; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.ancho { width: 100%; }
.btn.sec { background: var(--relleno); color: var(--tinta); }
.btn.peq-btn { height: 40px; font-size: 14px; padding: 0 14px; border-radius: 12px; }
.btn:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { .btn:hover { opacity: .9; } }

/* chips */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px; scroll-padding-inline: 16px; }
@media (min-width: 960px) { .chips { margin-inline: 0; padding-inline: 0; flex-wrap: wrap; overflow: visible; } }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 38px; padding: 0 14px; border-radius: 19px; border: 0; background: var(--tarjeta); box-shadow: var(--sombra-1), inset 0 0 0 1px var(--linea);
  font-size: 14px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; transition: transform 120ms var(--ease-out), background-color 150ms ease; }
.chip[aria-pressed="true"] { background: var(--primario); color: var(--primario-tinta); box-shadow: none; }
.chip:active { transform: scale(.96); }
.chip .cuenta { opacity: .55; font-weight: 500; font-variant-numeric: tabular-nums; }
.chip .foto { border-radius: 8px; }
@media (hover: hover) and (pointer: fine) { .chip:not([aria-pressed="true"]):hover { background: var(--relleno); } }

/* etiquetas */
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 11.5px; font-weight: 600; border-radius: 7px; padding: 2px 7px; line-height: 1.3; white-space: nowrap; }
.tag.sano { color: var(--sano); background: var(--sano-fondo); }
.tag.cheque { color: var(--cheque); background: var(--cheque-fondo); }
.tag.neutra { color: var(--tinta-2); background: var(--relleno); }
.tag.oferta { color: #fff; background: var(--oferta); }
.tag.ultra { color: var(--cheque); background: var(--cheque-fondo); }
.tag.aviso-tag { color: var(--cheque); background: var(--cheque-fondo); }
/* nivel de naturalidad: cinco barras, como un medidor */
.nivel { display: inline-flex; gap: 3px; align-items: center; }
.nivel i { width: 14px; height: 6px; border-radius: 3px; background: var(--relleno); }
.nivel i.on { background: var(--sano); }
.nivel.bajo i.on { background: var(--cheque); }
.natural { padding: 14px 16px; display: grid; gap: 8px; }
.natural .cab-nat { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.natural .ingr { font-size: 13px; color: var(--tinta-2); line-height: 1.45; }
.natural mark { background: var(--cheque-fondo); color: var(--cheque); border-radius: 4px; padding: 0 2px; }
.criterio { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; color: var(--tinta-2); }
.criterio b { color: var(--tinta); }
.escenarios { list-style: none; margin: 0; padding: 0 16px; }
.escenarios li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--linea); font-size: 14px; }
.escenarios li:first-child { border-top: 0; }
.escenarios .cifra { font: 700 17px/1 var(--display); font-variant-numeric: tabular-nums; }
.escenarios .mejor .cifra { background: var(--etiqueta); color: var(--etiqueta-tinta); padding: 5px 8px; border-radius: 8px; }
.escenarios button { all: unset; cursor: pointer; display: contents; }

/* selector de cantidad: + que se abre a − 1 + */
.cantidad { display: inline-flex; align-items: center; height: 40px; border-radius: 20px; background: var(--primario); color: var(--primario-tinta);
  box-shadow: var(--sombra-2); overflow: hidden; }
.cantidad button { width: 40px; height: 40px; border: 0; background: none; color: inherit; display: grid; place-items: center; transition: transform 120ms var(--ease-out); }
.cantidad button:active { transform: scale(.88); }
.cantidad button svg { width: 18px; height: 18px; }
.cantidad output { min-width: 18px; text-align: center; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.cantidad.sola { width: 40px; }
.cantidad.abierta { animation: abrirCantidad 200ms var(--ease-out); }
@keyframes abrirCantidad { from { transform: scale(.85); opacity: .6; } }

/* ---------- inicio ---------- */
.super-fila { display: flex; gap: 10px; align-items: center; }
.super-fila .logo { box-shadow: var(--sombra-1), 0 0 0 1px rgba(22, 27, 51, .06); }
.rejilla-sec { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 560px) { .rejilla-sec { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.sec-tile { border: 0; text-align: left; padding: 14px; border-radius: var(--r-tarjeta); background: var(--tarjeta); box-shadow: var(--sombra-1);
  display: grid; gap: 10px; align-content: space-between; min-height: 132px; transition: transform 140ms var(--ease-out), box-shadow 200ms ease; }
.sec-tile:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { .sec-tile:hover { box-shadow: var(--sombra-2); } }
.sec-tile b { font: 700 16px/1.2 var(--display); }
.sec-tile .peq { margin-top: 2px; }
.collage { display: flex; }
.collage .foto { width: 46px; height: 46px; border-radius: 12px; box-shadow: 0 0 0 2px var(--tarjeta); }
.collage .foto + .foto { margin-left: -10px; }

/* ---------- búsqueda ---------- */
.comp { padding: 18px; display: grid; gap: 14px; }
.comp-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.comp-cab .h2 { font-size: 22px; }
.ganador { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; align-items: center; background: var(--etiqueta); color: var(--etiqueta-tinta);
  border-radius: 18px; padding: 12px; border: 0; text-align: left; width: 100%; position: relative; transition: transform 140ms var(--ease-out); }
.ganador:active { transform: scale(.985); }
.ganador .foto { width: 76px; height: 76px; }
.ganador .precio { font: 800 28px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.ganador .pu-gan { font: 600 14px/1 var(--texto); letter-spacing: 0; opacity: .8; margin-left: 4px; }
.rival .dif { color: var(--oferta); font-weight: 600; }
.ganador .n { font-size: 14px; opacity: .85; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ganador .sello { position: absolute; top: 10px; right: 12px; font-size: 11px; font-weight: 700; letter-spacing: .02em; background: var(--etiqueta-tinta); color: var(--etiqueta);
  padding: 3px 8px; border-radius: 999px; }
.ganador .tag { background: rgba(255, 255, 255, .6); color: var(--etiqueta-tinta); }
.rivales { list-style: none; margin: 0; padding: 0; display: grid; }
.rival { border: 0; background: none; width: 100%; text-align: left; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 10px 2px; border-top: 1px solid var(--linea); border-radius: 0; }
.rival .n { font-size: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rival .pu { text-align: right; font: 700 16px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.rival .pu small { display: block; font: 500 12px/1.3 var(--texto); color: var(--tinta-2); }
.rival .dif { color: var(--oferta); }
@media (hover: hover) and (pointer: fine) { .rival:hover .n { text-decoration: underline; text-underline-offset: 3px; } }
.intencion { display: grid; gap: 8px; margin-top: 14px; }
.barra-res { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.barra-res select { height: 38px; border-radius: 12px; border: 0; background: var(--tarjeta); color: var(--tinta); box-shadow: var(--sombra-1), inset 0 0 0 1px var(--linea); padding: 0 12px; font-size: 14px; font-weight: 600; }

/* tarjetas de producto */
.rejilla-prod { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0; }
@media (min-width: 600px) { .rejilla-prod { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.pcard { position: relative; background: var(--tarjeta); border-radius: var(--r-tarjeta); box-shadow: var(--sombra-1); padding: 10px 10px 12px;
  display: grid; grid-template-rows: auto auto 1fr; gap: 8px; content-visibility: auto; contain-intrinsic-size: 260px; min-width: 0; }
.pcard .abrir { all: unset; cursor: pointer; display: grid; gap: 8px; border-radius: 14px; min-width: 0; }
.pcard .abrir:focus-visible { outline: 2.5px solid var(--foco); outline-offset: 2px; }
.pcard .imagen { position: relative; background: #fff; border-radius: 14px; display: grid; place-items: center; aspect-ratio: 1 / 1; max-width: 100%; overflow: hidden; }
.pcard .imagen .logo { position: absolute; top: 6px; left: 6px; }
.pcard .precio { font: 800 19px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.pcard .precio s { font: 500 13px var(--texto); color: var(--tinta-3); }
.pcard .pu { font-size: 12.5px; color: var(--tinta-2); font-variant-numeric: tabular-nums; }
.pcard .n { font-size: 14px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.6em; }
.pcard { container-type: inline-size; }
.pcard .accion { position: absolute; right: 16px; top: calc(100cqw - 56px); z-index: 1; }
@media (hover: hover) and (pointer: fine) { .pcard { transition: box-shadow 200ms ease; } .pcard:hover { box-shadow: var(--sombra-2); } }

/* filas de producto (listas, ficha, categorías) */
.filas { list-style: none; margin: 0; padding: 0 14px; }
.fila { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--linea); }
.fila:first-child { border-top: 0; }
.fila .abrir { all: unset; cursor: pointer; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-width: 0; border-radius: 12px; }
.fila .abrir:focus-visible { outline: 2.5px solid var(--foco); outline-offset: 2px; }
.fila .info { min-width: 0; display: grid; gap: 3px; }
.fila .n { font-size: 15px; font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.fila .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--tinta-2); }
.fila .pu { text-align: right; font: 700 16px/1.15 var(--display); font-variant-numeric: tabular-nums; }
.fila .pu small { display: block; font: 500 12px/1.3 var(--texto); color: var(--tinta-2); }
.fila.hecho .n { text-decoration: line-through; color: var(--tinta-3); }
.fila.sin-accion { grid-template-columns: minmax(0, 1fr); }
@media (hover: hover) and (pointer: fine) { .fila .abrir:hover .n { text-decoration: underline; text-underline-offset: 3px; } }
.check { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; flex: none; margin-left: -8px; }
.check span { width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--tinta-3); display: grid; place-items: center; transition: background-color 150ms ease, border-color 150ms ease; }
.check span svg { width: 15px; height: 15px; }
.check[aria-pressed="true"] span { background: var(--sano); border-color: var(--sano); color: #fff; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useEffect, useMemo, useRef, useCallback, useDeferredValue, memo } = React;
const html = htm.bind(React.createElement);
/* ------------------------------------------------------------------ utilidades */
const CONECTORES = new Set(["de","del","la","el","los","las","con","en","y","al","a","para","o","e","su"]);
const eur = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });
const fmt = v => v == null ? "—" : eur.format(v);
const norm = t => (t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const stem = w => {
  if (w.length > 4 && w.endsWith("ones")) w = w.slice(0, -2);
  else if (w.length > 3 && w.endsWith("s") && !w.endsWith("ss")) w = w.slice(0, -1);
  if (w.length > 4 && (w.endsWith("a") || w.endsWith("o"))) w = w.slice(0, -1);
  return w;
};
const tokens = q => norm(q).split(" ").filter(w => w && !CONECTORES.has(w)).map(stem);
// sinónimos: «leche de almendras» es como las tiendas llaman a la «bebida de almendras»
const VEGETAL = /^(almendr|aven|soj|arroz|coc|avellan|chuf|nuez|nuec|espelt|anacard|guisant|quino|cañam|canam)/;
const SINONIMOS = { zum: ["jug"], jug: ["zum"], yogurt: ["yogur"], aguacat: ["palt"] };
function consulta(q) {
  const t = tokens(q);
  const vegetal = t.some(w => VEGETAL.test(w));
  return t.map(w => w === "leche" && vegetal ? ["leche", "bebid"] : [w, ...(SINONIMOS[w] || [])]);
}
const empieza = (o, alts) => o && alts.some(a => o.startsWith(a));
// la misma palabra (las raíces ya quitan plural y género: «limones» = «limón»), no otra que empieza igual («limonada», «salsa»)
const igual = (o, alts) => o && alts.some(a => o === a);
const leer = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const UNID = ["kg", "L", "ud", "docena", "lavado"];
const fmtU = (v, u) => v == null || u == null ? "" : `${eur.format(v)}/${UNID[u]}`;
// accesos rápidos: [texto, categoría a la que llevan] (la categoría evita ambigüedades: «Patatas» frescas, no de bolsa)
const BASICOS = [["Leche entera", "l_leche"], ["Huevos medianos", "l_huevos"], ["Pan de molde", "pa_molde"],
  ["Jamón serrano", "ch_jamon"], ["Pavo", "ch_pavo"], ["Pechuga de pollo", "c_pollo"], ["Aceite de oliva virgen extra", "d_aceite"],
  ["Plátano", "fruta"], ["Patatas", "patata"], ["Tomate frito", "d_tomate"], ["Yogur natural", "l_yogur"], ["Arroz redondo", "d_arroz"],
  ["Atún", "d_conserva_pescado"], ["Agua mineral", "b_agua"], ["Papel higiénico", "li_papel"], ["Detergente", "li_ropa"]];

/* ------------------------------------------------------------------ catálogo */
function preparar(d) {
  const P = d.productos.map((r, i) => ({
    i, s: r[0], id: r[1], n: r[2], b: r[3], p: r[4], a: r[5], up: r[6], u: r[7], q: r[8], sec: r[9], t: r[10], g: r[11],
    foto: r[12], url: r[13] ? d.urls[r[0]] + r[13] : null, busca: r[14].split(" "), k: r[0] + ":" + r[1],
    cat: r[15] ?? -1, gr: !!r[16], ch: r[17] || 0, pk: r[18] || 0, sa: r[19] || 0, mo: (d.motivos || [])[r[20]] || "",
    ig: r[21] ? r[21].split(" ") : [],
  }));
  const cats = (d.categorias || []).map(([nombre, sec, clave], i) => ({ i, nombre, sec, clave, tipos: [], n: 0 }));
  const T = d.tipos.map(([etq, sec, orden, vis, canon]) => {
    const cl = canon ? canon.split(" ") : [];
    return { etq, sec, orden: orden ? orden.split(" ") : [], vis: vis ? vis.split(" ") : [], prods: [], canon: new Set(cl), canonL: cl.filter(c => c[0] !== "#") };
  });
  const e = d.equivalencias || { frases: [], palabras: {}, ignorar: [] };
  const eq = { frases: e.frases.map(([src, c]) => [new RegExp(src), c]), pal: e.palabras, ign: new Set(e.ignorar) };
  const porClave = new Map(), porGrupo = new Map(), porTiendaSec = new Map();
  for (const p of P) {
    const ts = p.s * 100 + p.sec;
    if (!porTiendaSec.has(ts)) porTiendaSec.set(ts, []);
    porTiendaSec.get(ts).push(p);
    T[p.t].prods.push(p);
    porClave.set(p.k, p);
    if (cats[p.cat]) cats[p.cat].n++;
    if (p.g >= 0) { if (!porGrupo.has(p.g)) porGrupo.set(p.g, []); porGrupo.get(p.g).push(p); }
  }
  const tiposPorSec = d.secciones.map(() => []);
  T.forEach((t, ti) => {
    const tiendas = new Set(t.prods.map(p => p.s));
    t.tiendas = tiendas.size;
    const cc = new Map();
    for (const p of t.prods) cc.set(p.cat, (cc.get(p.cat) || 0) + 1);
    t.cat = [...cc.entries()].sort((a, b) => b[1] - a[1])[0][0];
    if (tiendas.size >= 2) { tiposPorSec[t.sec].push(ti); if (cats[t.cat]) cats[t.cat].tipos.push(ti); }
  });
  const orden = (a, b) => T[b].tiendas - T[a].tiendas || T[b].prods.length - T[a].prods.length;
  tiposPorSec.forEach(l => l.sort(orden));
  cats.forEach(c => c.tipos.sort(orden));
  const catsPorSec = d.secciones.map((_, s) => cats.filter(c => c.sec === s && c.n > 0));
  return { ...d, P, T, cats, catsPorSec, porClave, porGrupo, porTiendaSec, tiposPorSec, eq };
}

/* ------------------------------------------------------------------ ajustes de la persona */
// Gastos de envío por defecto (publicados en prensa; dependen de la zona, se pueden cambiar en Ajustes)
const ENVIOS_DEF = [
  { activo: true, coste: 8.2, umbral: null, costeSobre: 8.2, minimo: 50 },   // Mercadona: 8,20 €, pedido mínimo 50 €
  { activo: true, coste: 7, umbral: 60, costeSobre: 4, minimo: 0 },          // Consum: 7 €, 4 € desde 60 €
  { activo: true, coste: 4.99, umbral: 100, costeSobre: 0, minimo: 0 },      // DIA: 4,99 €, gratis desde 100 €
  { activo: false, coste: 0, umbral: null, costeSobre: 0, minimo: 0 },       // LIDL no lleva la compra de alimentación a casa
];
const AJ_DEF = { saludable: false, socio: false, envios: ENVIOS_DEF };
let AJ = AJ_DEF; // ajustes vigentes; App los fija en cada render a partir del estado guardado
const mezclarAjustes = a => ({ ...AJ_DEF, ...(a || {}), envios: ENVIOS_DEF.map((e, i) => ({ ...e, ...(((a || {}).envios || [])[i] || {}) })) });
const chequeDe = p => AJ.socio && p.s === 1 && p.ch ? p.ch : 0;
const precioEf = p => Math.max(0, Math.round((p.p - chequeDe(p)) * 100) / 100);
const upEf = p => p.up == null ? null : chequeDe(p) ? Math.round(p.up * precioEf(p) / p.p * 100) / 100 : p.up;
// lo sano = lo natural: nivel 0-4 según sus ingredientes (ver «Cómo se decide» en Ajustes)
const nivelDe = p => Math.min(4, Math.floor((p.sa || 0) / 10));
const NIVELES = ["Ultraprocesado", "Con aditivos", "Poco procesado", "Sin aditivos", "Natural"];
const sinDatos = p => p.mo === "Sin datos de ingredientes";
// en modo saludable gana el más natural; a igualdad, el más barato por kg o L
const mejorQue = (a, b) => AJ.saludable && a.sa !== b.sa ? a.sa > b.sa : (upEf(a) < upEf(b) || (upEf(a) === upEf(b) && precioEf(a) < precioEf(b)));

/* búsqueda: como en las webs de los supermercados, pero agrupando por tipo de producto */
/* equivalencias entre tiendas (tablas al final de scripts/categorias.py): «gulas» encuentra las «Delicias del mar de surimi» de Mercadona
   y «ternera para guisar» los «Tacos de vacuno para guisar»; cada palabra se busca también por su sinónimo */
function conceptosDe(C, texto) {
  const n = norm(texto);
  return C.eq.frases.filter(([rx]) => rx.test(n)).map(([, c]) => c);
}
function buscar(C, q) {
  const qt = consulta(q).map(alts => {
    const m = new Set(alts);
    for (const a of alts) if (C.eq.pal[a]) m.add(C.eq.pal[a]);
    return [...m];
  });
  if (!qt.length) return null;
  const qc = conceptosDe(C, q);
  const res = [];
  for (const p of C.P) {
    const T = C.T[p.t];
    let ok = true;
    for (const w of qt) { if (!p.busca.some(b => empieza(b, w)) && !T.canonL.some(c => empieza(c, w))) { ok = false; break; } }
    const porConcepto = qc.length > 0 && qc.every(c => T.canon.has(c));
    if (!ok && !porConcepto) continue;
    const ot = T.orden;
    const prefijo = qt.every((w, i) => igual(ot[i], w));

/* intención: ¿qué quiere decir quien busca «pavo»? Se puntúa cada categoría por cuántos productos

  for (const e of m.values()) {

function comparar(C, r, q, opciones = {}) {

  const titulo = exacto ? C.T[exacto.p.t].etq : texto.charAt(0).toUpperCase() + texto.slice(1).toLowerCase();

/* ------------------------------------------------------------------ equivalencias para la lista */

/* sin formato («Huevos» de Mercadona, sin cantidad) se estima cuánto trae con su precio y lo que cuesta el kg, L

const NO_ALIMENTO = new Set(["Limpieza y hogar", "Higiene y belleza", "Otros", "Mascotas"]);
function cantidadEstimada(C, ref) {

  if (!(ref.p > 0) || ref.cat < 0 || NO_ALIMENTO.has(C.secciones[ref.sec])) return null;

    if (m) return { ...costeCon(C, m, ref, cant), como: "igual" };

    let mejor = null;

          if (s !== quitar) return s;
          let m = null, ms = null;
          for (const t of resto) { const e = opciones[i].por[t]; if (e && (!m || e.coste < m.coste)) { m = e; ms = t; } }
          return ms == null ? s : ms;
        });
        const r = evaluar(conj, prueba);
        if (r.coste < actual.coste - 0.001) { eleccion = prueba; actual = r; mejoro = true; }
      }
      if (!mejoro) break;
    }
    return actual;
  };
  const resolver = conj => {
    const voraz = opciones.map(o => {
      let mejor = null, ms = null;
      for (const s of conj) { const e = o.por[s]; if (e && (!mejor || e.coste < mejor.coste)) { mejor = e; ms = s; } }
      return ms;
    });
    let actual = mejorar(conj, voraz);
    if (conj.length > 1) for (const t of conj) {
      const todo = opciones.map((o, i) => o.por[t] ? t : voraz[i]);
      const r = mejorar(conj, todo);
      if (r.coste < actual.coste - 0.001) actual = r;
    }
    actual.asign = opciones.map((o, i) => ({ o, s: actual.eleccion[i], e: actual.eleccion[i] == null ? null : o.por[actual.eleccion[i]] }));
    // una tienda que se queda sin productos no se usa (ni paga envío)
    actual.usadas = conj.filter(s => actual.sub[s] != null);
    actual.sustitutos = actual.asign.filter(a => a.e && a.e.como === "sustituto").length;
    return actual;
  };
  const posibles = [...activas].filter(s => !envio || (AJ.envios[s] && AJ.envios[s].activo));
  const subconjuntos = [];
  (function rec(i, act) {
    if (act.length) subconjuntos.push(act);
    for (let j = i; j < posibles.length; j++) rec(j + 1, [...act, posibles[j]]);
  })(0, []);
  const todos = subconjuntos.map(resolver);
  const orden = (a, b) => a.faltan.length - b.faltan.length || a.cortos.length - b.cortos.length || a.coste - b.coste;
  const mejorDe = lista => lista.length ? [...lista].sort(orden)[0] : null;
  // el mejor plan usando como mucho k supermercados (k = 1…4): nunca sale más caro al permitir más
  const porMax = {};
  for (let k = 1; k <= C.tiendas.length; k++) porMax[k] = mejorDe(todos.filter(r => r.usadas.length <= k && r.usadas.length > 0));
  const plan = porMax[Math.min(maxTiendas, C.tiendas.length)] || null;
  const mejor = mejorDe(todos.filter(r => r.usadas.length > 0));
  const unaTienda = Array.from({ length: C.tiendas.length }, (_, s) => ({ ...resolver([s]), sinEnvio: envio && !(AJ.envios[s] && AJ.envios[s].activo) }));
  const mejorUna = mejorDe(unaTienda.filter(r => activas.has(r.conj[0]) && !r.sinEnvio));
  return { plan, porMax, mejor, unaTienda, mejorUna, n: vivos.length, envio };
}

/* ------------------------------------------------------------------ estado de la lista (privado por persona) */
const CLAVE_LOCAL = "comparador.estado.v1";
const ESTADO_INICIAL = { items: [], activas: [0, 1, 2, 3], max: 4, envio: false, ajustes: {}, rev: 0 };
function useEstado() {
  const [estado, setEstado] = useState(() => ({ ...ESTADO_INICIAL, ...leer(CLAVE_LOCAL, {}) }));
  const ref = useRef(null), cola = useRef(Promise.resolve()), temporizador = useRef(null), ultimo = useRef(estado);
  const [sync, setSync] = useState("local");
  ultimo.current = estado;
  useEffect(() => {
    let unsub = null, vivo = true;
    (async () => {
      const c = window.claude;
      if (!c || !c.use) return;
      const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
      if (!vivo || !db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const doc = db.doc("data/users/" + uid + "/estado");
      ref.current = doc;
      setSync("nube");
      unsub = doc.onSnapshot(snap => {
        if (!snap.exists) { if (ultimo.current.items.length) programar(); return; }
        if (snap.metadata.hasPendingWrites) return;
        const r = snap.data();
        if ((r.rev || 0) > (ultimo.current.rev || 0)) setEstado(e => ({ ...e, ...r }));
      }, () => setSync("local"));
    })();
    return () => { vivo = false; unsub && unsub(); };
  }, []);
  const programar = useCallback(() => {
    clearTimeout(temporizador.current);
    temporizador.current = setTimeout(() => {
      const doc = ref.current; if (!doc) return;
      const datos = JSON.parse(JSON.stringify(ultimo.current));
      cola.current = cola.current.then(() => doc.set(datos)).catch(() => setSync("local"));
    }, 600);
  }, []);
  const cambiar = useCallback(fn => {
    setEstado(e => {
      const n = { ...fn(e), rev: Date.now() };
      guardar(CLAVE_LOCAL, n);
      return n;
    });
    programar();
  }, [programar]);
  return [estado, cambiar, sync];
}

const Foto = memo(function Foto({ C, p, t = 56, radio }) {

// etiquetas: más saludable (con su motivo), Cheque Crece y oferta pack
function Etiquetas({ p, todas = true }) {
  const t = [];
  if (p.a) t.push(html`<span key="o" class="tag oferta">Oferta</span>`);
  const nv = nivelDe(p);
  if (nv === 4) t.push(html`<span key="s" class="tag sano">${todas ? p.mo : "Natural"}</span>`);
  else if (AJ.saludable && nv === 0) t.push(html`<span key="s" class="tag ultra">Ultraprocesado</span>`);
  if (p.ch > 0) t.push(html`<span key="c" class="tag cheque">${AJ.socio ? "−" : "+"}${fmt(p.ch)} Cheque Crece</span>`);
  if (todas && p.pk) t.push(html`<span key="p" class="tag neutra">${p.pk[0]} × ${fmt(p.pk[1])}</span>`);
  if (todas && p.gr) t.push(html`<span key="g" class="tag neutra">Formato grande</span>`);
  return t.length ? html`<span class="tags">${t}</span>` : null;
}

  const { filas, u } = comp;
  const mejor = filas[0];

  return html`<section class="tarjeta comp" aria-labelledby="comp-tit">

    <button class="ganador" onClick=${() => abrir(mejor.p)} aria-label=${`Más ${AJ.saludable ? "sano" : "barato"}: ${mejor.p.n} en ${C.tiendas[mejor.s]}, ${fmtU(upEf(mejor.p), u)}`}>

function Resultados({ C, r, cantidadDe, poner, abrir }) {
  const [orden, setOrden] = useState("relevancia");
  const [tienda, setTienda] = useState(-1);
  const [ver, setVer] = useState(24);
  useEffect(() => setVer(24), [r, orden, tienda]);
  const lista = useMemo(() => {
    let l = r.res.filter(x => tienda < 0 || x.p.s === tienda);
    const pu = x => x.p.up == null ? Infinity : upEf(x.p);
    const sano = (a, b) => AJ.saludable ? b.p.sa - a.p.sa : 0;
    if (orden === "relevancia") l = [...l].sort((a, b) => a.nivel - b.nivel || a.p.gr - b.p.gr || sano(a, b) || a.extra - b.extra || pu(a) - pu(b));
    else if (orden === "sano") l = [...l].sort((a, b) => b.p.sa - a.p.sa || pu(a) - pu(b));
    else if (orden === "unidad") l = [...l].sort((a, b) => pu(a) - pu(b));
    else l = [...l].sort((a, b) => precioEf(a.p) - precioEf(b.p));
    return l;
  }, [r, orden, tienda, AJ]);
  return html`<section class="seccion" aria-labelledby="res-tit">
    <div class="barra-res">
      <h2 class="h2" id="res-tit">${lista.length.toLocaleString("es-ES")} ${lista.length === 1 ? "producto" : "productos"}</h2>

        <select id="orden" name="orden" value=${orden} onChange=${e => setOrden(e.target.value)}>

    </div>
    <ul class="rejilla-prod">${lista.slice(0, ver).map(x => html`<${TarjetaProducto} key=${x.p.k} C=${C} p=${x.p} n=${cantidadDe(x.p.k)} poner=${poner} abrir=${abrir} aj=${AJ} />`)}</ul>
    ${ver < lista.length && html`<button class="btn sec ancho" onClick=${() => setVer(v => v + 36)}>Ver ${Math.min(36, lista.length - ver)} más</button>`}
  </section>`;
}

function fotosDe(C, tipos, n = 3) {
  const out = [];
  for (const ti of tipos) {
    const p = C.T[ti].prods.find(x => x.foto >= 0 && !x.gr);
    if (p) out.push(p);
    if (out.length === n) break;
  }
  return out;
}

function FilaTipo({ C, ti, irA }) {
  const t = C.T[ti];
  let m = null;
  for (const p of t.prods) if (p.up != null && !p.gr && (!m || mejorQue(p, m))) m = p;
  m = m || t.prods[0];
  const tiendas = [...new Set(t.prods.map(p => p.s))].sort();
  return html`<li class="fila sin-accion">
    <button class="abrir" onClick=${() => irA(t.etq, t.cat)} aria-label=${`Comparar ${t.etq}`}>

}

function Inicio({ C, irA, abrirSec }) {
  const secs = useMemo(() => C.secciones.map((n, i) => ({ n, i, fotos: fotosDe(C, C.tiposPorSec[i]) })).filter(x => C.catsPorSec[x.i].length), [C]);
  const basicos = useMemo(() => BASICOS.map(([texto, clave]) => {
    const c = C.cats.find(x => x.clave === clave);
    const r = buscar(C, texto);
    const p = r && r.res.find(x => x.p.foto >= 0 && (!c || x.p.cat === c.i) && x.nivel <= 1);
    return { texto, cat: c ? c.i : undefined, p: p && p.p };
  }), [C]);
  return html`<div>
    <section class="seccion" aria-labelledby="bas-tit">
      <h2 class="h2" id="bas-tit">Lo de siempre</h2>
      <div class="chips">${basicos.map(b => html`<button key=${b.texto} class="chip" style=${{ paddingLeft: b.p ? 5 : 14 }} onClick=${() => irA(b.texto, b.cat)}>
        ${b.p && html`<${Foto} C=${C} p=${b.p} t=${28} />`}${b.texto}</button>`)}</div>
    </section>
    <section class="seccion" aria-labelledby="secs-tit">
      <h2 class="h2" id="secs-tit">Secciones</h2>
      <div class="rejilla-sec">${secs.map(x => html`<button key=${x.n} class="sec-tile" onClick=${() => abrirSec(x.i)}>
        <span class="collage" aria-hidden="true">${x.fotos.map(p => html`<${Foto} key=${p.k} C=${C} p=${p} t=${46} />`)}</span>
        <span><b>${x.n}</b><span class="peq" style=${{ display: "block" }}>${C.tiposPorSec[x.i].length} comparativas</span></span></button>`)}</div>
    </section>
  </div>`;
}

function Buscar({ C, q, setQ, cantidadDe, poner, abrir, aj }) {
  const qd = useDeferredValue(q);
  const [sec, setSec] = useState(-1);
  const [catSel, setCatSel] = useState(null);
  const [grandes, setGrandes] = useState(false);
  const pendiente = useRef(null);
  const irA = useCallback((texto, cat) => { pendiente.current = cat ?? null; setQ(texto); window.scrollTo(0, 0); }, [setQ]);
  useEffect(() => { setCatSel(pendiente.current); pendiente.current = null; setGrandes(false); }, [qd]);
  useEffect(() => { if (q) setSec(-1); }, [q]);
  const r = useMemo(() => buscar(C, qd), [C, qd]);
  const opciones = useMemo(() => intencion(C, r), [C, r]);
  const cat = catSel !== null && (catSel === -1 || opciones.some(o => o.c === catSel)) ? catSel : (opciones[0] ? opciones[0].c : -1);
  const rc = useMemo(() => r && cat >= 0 ? { ...r, res: r.res.filter(x => x.p.cat === cat) } : r, [r, cat]);
  const comp = useMemo(() => comparar(C, rc, qd, { cat, grandes }), [C, rc, qd, cat, grandes, aj]);
  if (!qd.trim()) {
    if (sec >= 0) return html`<${VistaSeccion} C=${C} sec=${sec} volver=${() => setSec(-1)} irA=${irA} />`;
    return html`<${Inicio} C=${C} irA=${irA} abrirSec=${i => { setSec(i); window.scrollTo(0, 0); }} />`;
  }
  if (!r || !r.res.length) return html`<div class="vacio"><span class="icono-grande">${Icono.lupa}</span><h2 class="h2">Nada para «${qd}»</h2>
    <p>Prueba con menos palabras o con el nombre genérico del producto: «leche» en lugar de una marca.</p></div>`;
  return html`<div>
    <${QueBuscas} C=${C} opciones=${opciones} cat=${cat} elegir=${setCatSel} />
    <div class="seccion" style=${{ marginTop: 14 }}><${Comparativa} C=${C} comp=${comp} cantidadDe=${cantidadDe} poner=${poner} abrir=${abrir} refinar=${irA} q=${qd}
      cat=${cat} grandes=${grandes} setGrandes=${setGrandes} /></div>
    <${Resultados} C=${C} r=${rc} cantidadDe=${cantidadDe} poner=${poner} abrir=${abrir} />
  </div>`;
}

function ResumenPlan({ C, r, ir, compacto }) {
  const plan = r && r.plan;
  if (!plan) return null;
  return html`<button class="tarjeta" onClick=${() => ir("comprar")} style=${{ border: 0, textAlign: "left", width: "100%", padding: 16, display: "grid", gridTemplateColumns: "minmax(0,1fr) auto", gap: 12, alignItems: "center" }}
    aria-label=${`Ver dónde comprar. Total ${fmt(plan.total)}`}>
    <span style=${{ display: "grid", gap: 6, minWidth: 0 }}>
      <span class="peq">${plan.usadas.length > 1 ? "Lo más barato, repartiendo" : "Lo más barato hoy"}${plan.gastos ? ", con envío" : ""}</span>
      <span style=${{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
        ${plan.usadas.map(s => html`<${TiendaChip} key=${s} C=${C} s=${s} t=${22} />`)}</span>
    </span>
    <span style=${{ display: "flex", alignItems: "center", gap: 6 }}><span class="num" style=${{ font: `800 ${compacto ? 22 : 26}px/1 var(--display)` }}>${fmt(plan.total)}</span>${Icono.flecha}</span>
  </button>`;
}

function Lista({ C, estado, cambiar, abrir, ir, poner, r }) {
  const [vaciar, setVaciar] = useState(false);
  const items = estado.items;
  const pend = items.filter(it => !it.h).length;
  const fijar = (k, fn) => cambiar(e => ({ ...e, items: e.items.map(it => it.k === k ? fn(it) : it) }));
  if (!items.length) return html`<div class="vacio"><span class="icono-grande">${Icono.lista}</span><h2 class="h2">Tu lista está vacía</h2>
    <p>Busca un producto y pulsa + para añadirlo. Después verás en qué supermercado te sale más barata la compra.</p>
    <button class="btn" onClick=${() => ir("buscar")}>${Icono.lupa} Buscar productos</button></div>`;
  return html`<div>
    <section class="seccion" style=${{ marginTop: 14 }}><${ResumenPlan} C=${C} r=${r} ir=${ir} /></section>
    <section class="seccion" aria-labelledby="lista-tit">
      <div class="seccion-cab"><h2 class="h2" id="lista-tit">Productos</h2><span class="peq">${pend} de ${items.length} por coger</span></div>
      <ul class="filas tarjeta">${items.map(it => {
        const p = C.porClave.get(it.k);
        return html`<li key=${it.k} class="fila ${it.h ? "hecho" : ""}" style=${{ gridTemplateColumns: "auto minmax(0,1fr) auto" }}>
          <button class="check" aria-pressed=${!!it.h} aria-label=${it.h ? `Desmarcar ${it.n}` : `Marcar ${it.n} como cogido`} onClick=${() => fijar(it.k, x => ({ ...x, h: !x.h }))}>
            <span>${it.h ? Icono.ok : ""}</span></button>
          ${p ? html`<button class="abrir" style=${{ gridTemplateColumns: "48px minmax(0,1fr)" }} onClick=${() => abrir(p)} aria-label=${`Ver ${it.n}`}>
              <${Foto} C=${C} p=${p} t=${48} />
              <span class="info"><span class="n">${it.n}</span><span class="meta"><${TiendaChip} C=${C} s=${p.s} t=${16} /><span class="num">${fmt(precioEf(p))}</span></span></span></button>`
            : html`<span class="info"><span class="n">${it.n}</span><span class="peq">Ya no está a la venta</span></span>`}
          ${p ? html`<${Cantidad} n=${it.q} nombre=${it.n} mas=${() => poner(p, it.q + 1)} menos=${() => poner(p, it.q - 1)} />`
            : html`<button class="btn sec peq-btn" onClick=${() => cambiar(e => ({ ...e, items: e.items.filter(x => x.k !== it.k) }))}>Quitar</button>`}
        </li>`;
      })}</ul>
      <div style=${{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        ${items.some(it => it.h) && html`<button class="btn sec peq-btn" onClick=${() => cambiar(e => ({ ...e, items: e.items.filter(it => !it.h) }))}>Quitar lo cogido</button>`}
        ${!vaciar ? html`<button class="btn sec peq-btn" onClick=${() => setVaciar(true)}>Vaciar lista</button>`
          : html`<span class="tarjeta" role="alertdialog" aria-label="Confirmar" style=${{ display: "flex", gap: 8, alignItems: "center", padding: "6px 6px 6px 14px", flexWrap: "wrap" }}>
              <span class="peq">¿Vaciar los ${items.length} productos?</span>
              <button class="btn peq-btn" onClick=${() => { cambiar(e => ({ ...e, items: [] })); setVaciar(false); }}>Vaciar</button>
              <button class="btn sec peq-btn" onClick=${() => setVaciar(false)}>Cancelar</button></span>`}
      </div>
    </section>
  </div>`;
}

}

function codigoCesta(s, filas) {

    const p = f.e.p, code = s === 1 && p.url ? (p.url.match(/\/(\d+)\/?$/) || [])[1] : undefined;

const enlaceCesta = (s, filas) => WEB_SUPER[s] + "#comparador=" + codigoCesta(s, filas);

function Marcador({ compacto }) {
  const ref = useRef(null);
  const [copiado, setCopiado] = useState(false);
  useEffect(() => { if (ref.current) ref.current.setAttribute("href", MARCADOR); }, []);
  const copiar = async () => { try { await navigator.clipboard.writeText(MARCADOR); setCopiado(true); setTimeout(() => setCopiado(false), 2500); } catch (e) { setCopiado(null); } };
  return html`<div style=${{ display: "grid", gap: 10 }}>
    ${!compacto && html`<p class="peq">Los súper no dejan que otra web llene su carrito, pero sí un marcador de tu navegador: lo pulsas estando en su web, con tu sesión, y añade toda la cesta de golpe. Se instala una sola vez y vale para Mercadona, Consum y DIA. Lo que añade es lo mismo que verás luego en su app, porque el carrito va con tu cuenta.</p>`}
    <ol class="criterio">
      <li><b>Copia el marcador:</b> <button class="enlace-btn" onClick=${copiar}>${copiado ? "¡Copiado!" : copiado === null ? "No se pudo copiar: mantén pulsado el enlace de abajo" : "Copiar marcador"}</button></li>
      <li><b>iPhone (Safari):</b> abre cualquier web, pulsa Compartir → «Añadir marcador», ponle de nombre <b>Llenar carrito</b> y guárdalo. Después ve a Marcadores, pulsa «Editar», toca el marcador y cambia su dirección pegando lo que copiaste.</li>
      <li><b>Ordenador:</b> arrastra este enlace a la barra de marcadores: <a ref=${ref} class="enlace" onClick=${e => { e.preventDefault(); copiar(); }}>Llenar carrito</a></li>
      <li><b>Para usarlo:</b> en la cesta pulsa «Llenar carrito en…»; se abre la web del súper; ahí abre Marcadores y toca «Llenar carrito». Si no has iniciado sesión, lo deja en el carrito de invitado y lo conservas al identificarte.</li>
    </ol>
  </div>`;
}

function GrupoTienda({ C, g, plan, envio, abrir, copiar }) {
  const [web, setWeb] = useState(false);
  const [ayuda, setAyuda] = useState(false);
  const e = AJ.envios[g.s];
  const sub = plan.sub[g.s] || 0;
  const gasto = envio ? plan.envios[g.s] : null;
  const falta = envio && e.umbral && sub < e.umbral ? r2(e.umbral - sub) : 0;
  const corto = envio && plan.cortos.includes(g.s);
  const texto = g.filas.map(f => `${f.e.n > 1 ? f.e.n + " × " : ""}${f.e.p.n}`).join("\n");
  return html`<div class="tarjeta grupo">
    <div class="grupo-cab"><${Logo} C=${C} s=${g.s} t=${36} />
      <span style=${{ minWidth: 0 }}><span class="h3" translate="no">${C.tiendas[g.s]}</span><span class="peq" style=${{ display: "block" }}>${g.filas.length} ${g.filas.length === 1 ? "producto" : "productos"}</span></span>
      <span class="subtotal">${fmt(r2(sub + (gasto || 0)))}</span></div>
    ${g.filas.map(f => html`<div key=${f.o.it.k} class="linea">
      <button style=${{ all: "unset", cursor: "pointer", borderRadius: 12 }} onClick=${() => abrir(f.e.p)} aria-label=${`Ver ${f.e.p.n}`}><${Foto} C=${C} p=${f.e.p} t=${44} /></button>
      <div style=${{ minWidth: 0 }}><div>${f.e.n > 1 ? `${f.e.n} × ` : ""}${f.e.p.n}</div>
        ${f.e.menosNatural && html`<div class="eq aviso">Menos natural que el que elegiste (${f.o.p.mo || NIVELES[nivelDe(f.o.p)]} → ${f.e.p.mo || NIVELES[nivelDe(f.e.p)]}): ${C.tiendas[g.s]} no tiene nada igual de natural</div>`}
        ${f.e.como === "sustituto" ? html`<div class="eq aviso">Sustituto: ${C.tiendas[g.s]} no tiene «${f.o.it.n}» ni uno del mismo tipo; es lo más parecido</div>`
          : f.e.como !== "igual" && html`<div class="eq">En lugar de ${f.o.it.n}${f.e.como === "parecido" ? " (parecido)" : f.e.como === "equivalente" ? ": aquí se llama así" : ""}</div>`}
        ${f.e.estimada && html`<div class="eq">Cantidad aproximada: «${f.o.it.n}» no dice cuánto trae, se ha calculado por su precio</div>`}
        ${g.s !== f.o.p.s && f.o.por[f.o.p.s] && f.o.por[f.o.p.s].coste - f.e.coste >= 0.01 && html`<div class="eq">Ahorras ${fmt(r2(f.o.por[f.o.p.s].coste - f.e.coste))} frente a comprarlo en ${C.tiendas[f.o.p.s]}</div>`}
        ${chequeDe(f.e.p) > 0 && html`<div class="eq">Incluye ${fmt(r2(chequeDe(f.e.p) * f.e.n))} de Cheque Crece</div>`}</div>
      <span class="num" style=${{ fontWeight: 600 }}>${fmt(f.e.coste)}</span></div>`)}
    ${envio && html`<div class="linea"><span></span><div>
        <div>${gasto ? "Gastos de envío" : "Envío gratis"}</div>
        ${falta > 0 && html`<div class="eq">Añade ${fmt(falta)} más y el envío ${e.costeSobre ? `baja a ${fmt(e.costeSobre)}` : "es gratis"}</div>`}
        ${corto && html`<div class="eq aviso">Pedido mínimo de ${fmt(e.minimo)}: faltan ${fmt(r2(e.minimo - sub))}</div>`}</div>
      <span class="num" style=${{ fontWeight: 600 }}>${gasto ? fmt(gasto) : fmt(0)}</span></div>`}
    ${g.s <= 2 && html`<div class="llenar">
      <a class="btn ancho" href=${enlaceCesta(g.s, g.filas)} target="_blank" rel="noopener" style=${{ textDecoration: "none" }}>${Icono.carro} Llenar carrito en ${C.tiendas[g.s]}</a>
      <p class="peq">Se abre su web: toca tu marcador «Llenar carrito» y se añade todo. <button class="enlace-btn" aria-expanded=${ayuda} onClick=${() => setAyuda(!ayuda)}>${ayuda ? "Ocultar" : "¿Primera vez?"}</button>
        <button class="enlace-btn" onClick=${() => copiar(enlaceCesta(g.s, g.filas), "la cesta")}>Copiar código</button></p>
      ${ayuda && html`<${Marcador} compacto=${true} />`}
    </div>`}
    <div class="grupo-pie">
      <button class="enlace-btn" aria-expanded=${web} onClick=${() => setWeb(!web)}>${web ? "Ocultar enlaces" : `Producto a producto en ${C.tiendas[g.s]}`}</button>
      <button class="enlace-btn" onClick=${() => copiar(texto, C.tiendas[g.s])}>Copiar lista</button>
    </div>
    ${web && html`<div class="web-lista">
      <p class="peq">Abre cada producto en la web de ${C.tiendas[g.s]} y añádelo a su carrito.${g.s === 3 ? " LIDL no vende alimentación online: llévate la lista a la tienda." : ""}</p>
      <ol>${g.filas.map(f => html`<li key=${f.o.it.k}>${f.e.p.url ? html`<a class="enlace" href=${f.e.p.url} target="_blank" rel="noopener">${f.e.n > 1 ? `${f.e.n} × ` : ""}${f.e.p.n}</a>` : f.e.p.n}</li>`)}</ol>
    </div>`}
  </div>`;
}

/* Formas de hacer la compra, de más barata a más cara: en uno, dos o los súper que haga falta, en tienda o con envío */
function Escenarios({ C, r, otro, estado, cambiar }) {
  if (!r || !r.porMax) return null;
  const nombre = x => x.usadas.map(s => C.tiendas[s]).join(" + ");
  const filas = [], vistos = new Set();
  const poner = (x, envio, max) => {
    if (!x || !x.usadas.length) return;
    const clave = (envio ? "e" : "t") + x.usadas.join(",");
    if (vistos.has(clave)) return;
    vistos.add(clave);
    filas.push({ x, envio, max, clave });
  };
  for (const [envio, plan] of [[r.envio, r], [!r.envio, otro]]) {
    if (!plan || !plan.porMax) continue;
    for (const k of [1, 2, 4]) poner(plan.porMax[k], envio, k);
  }
  if (filas.length < 2) return null;
  const completas = filas.filter(f => !f.x.faltan.length && !f.x.cortos.length);
  const base = completas.length ? completas : filas;
  base.sort((a, b) => a.x.total - b.x.total);
  const mas = base[0];
  const actual = filas.find(f => f.envio === r.envio && f.x === r.plan) || null;
  const lista = base.slice(0, 6);
  return html`<section class="seccion" aria-labelledby="esc-tit">
    <div class="seccion-cab"><h2 class="h2" id="esc-tit">Todas las formas de comprarlo</h2></div>
    <p class="peq">Calculado con tu lista entera: los mismos productos (o su equivalente más barato) en cada caso${r.envio || otro ? ", con y sin envío a casa" : ""}. Pulsa una opción para elegirla.</p>
    <ul class="escenarios tarjeta">${lista.map(f => {
      const elegido = actual && f.clave === actual.clave;
      return html`<li key=${f.clave} class=${f === mas ? "mejor" : ""}><button aria-pressed=${!!elegido}
          onClick=${() => cambiar(e => ({ ...e, envio: f.envio, max: f.max, activas: [...new Set([...e.activas, ...f.x.usadas])].sort() }))}>
        <span style=${{ minWidth: 0, display: "grid", gap: 3 }}>
          <span style=${{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap", fontWeight: 600 }}>${f.x.usadas.map(s => html`<${Logo} key=${s} C=${C} s=${s} t=${18} />`)}<span translate="no">${nombre(f.x)}</span></span>
          <span class="peq">${f.envio ? `A domicilio · ${f.x.gastos ? fmt(f.x.gastos) + " de envío" : "envío gratis"}` : "Yendo a la tienda"}${f.x.sustitutos ? ` · ${f.x.sustitutos} sustituto${f.x.sustitutos > 1 ? "s" : ""}` : ""}${f.x.faltan.length ? ` · faltan ${f.x.faltan.length}` : ""}${f.x.cortos.length ? " · no llega al pedido mínimo" : ""}${elegido ? " · lo que ves arriba" : ""}</span>
        </span>
        <span class="cifra">${fmt(f.x.total)}</span></button></li>`;
    })}</ul>
  </section>`;
}

function Comprar({ C, estado, cambiar, abrir, ir, avisar, r, otro }) {
  const activas = useMemo(() => new Set(estado.activas), [estado.activas]);
  const envio = !!estado.envio;

    <button class="btn" onClick=${() => ir("buscar")}>${Icono.lupa} Buscar productos</button></div>`;
  const alternar = s => cambiar(e => {
    const a = new Set(e.activas); a.has(s) ? a.delete(s) : a.add(s);
    return { ...e, activas: [...a].sort() };
  });
  const copiar = async (texto, tienda) => {
    try { await navigator.clipboard.writeText(texto); avisar(`Lista de ${tienda} copiada`); }
    catch (e) { avisar("No se ha podido copiar. Abre los enlaces de cada producto."); }
  };
  const plan = r && r.plan;
  const grupos = plan ? plan.usadas.map(s => ({ s, filas: plan.asign.filter(a => a.s === s) })).sort((a, b) => b.filas.length - a.filas.length) : [];
  const ahorro = plan && r.mejorUna && plan.faltan.length <= r.mejorUna.faltan.length ? r2(r.mejorUna.total - plan.total) : 0;
  // ¿el límite de súper elegido hace perder dinero? ¿y el modo (tienda o envío)?
  const extra = plan && r.mejor && r.mejor !== plan && r.mejor.faltan.length <= plan.faltan.length && !r.mejor.cortos.length ? r2(plan.total - r.mejor.total) : 0;
  const otroMejor = otro && otro.mejor;
  const otroAhorro = plan && otroMejor && !otroMejor.faltan.length && !otroMejor.cortos.length && otroMejor.faltan.length <= plan.faltan.length
    && (r.mejor ? r.mejor.total : plan.total) > 0 && (envio || estado.items.length >= 15 || plan.total >= 60) ? r2((r.mejor && !r.mejor.cortos.length ? r.mejor.total : plan.total) - otroMejor.total) : 0;
  return html`<div>
    <section class="seccion tarjeta" style=${{ padding: 16, marginTop: 14 }} aria-label="Cómo quieres comprar">
      <div class="seg" role="group" aria-label="¿Cómo vas a comprar?">
        <button aria-pressed=${!envio} onClick=${() => cambiar(e => ({ ...e, envio: false }))}>Voy a la tienda</button>
        <button aria-pressed=${envio} onClick=${() => cambiar(e => ({ ...e, envio: true }))}>Me lo traen a casa</button>
      </div>
      <div class="seg" role="group" aria-label="¿En cuántos supermercados?">
        ${[[1, "1 súper"], [2, "Hasta 2"], [4, "Los que haga falta"]].map(([n, t]) => html`<button key=${n} aria-pressed=${estado.max === n} onClick=${() => cambiar(e => ({ ...e, max: n }))}>${t}</button>`)}
      </div>
      <div class="logos-sel" role="group" aria-label="Supermercados que tienes en cuenta">
        ${C.tiendas.map((t, s) => {
          const sinEnvio = envio && !AJ.envios[s].activo;
          return html`<button key=${t} class="logo-sel" aria-pressed=${activas.has(s) && !sinEnvio} disabled=${sinEnvio} onClick=${() => alternar(s)}>
            <${Logo} C=${null} s=${s} t=${28} /><span translate="no">${t}</span>${sinEnvio ? html`<span class="peq">· sin envío</span>` : ""}</button>`;
        })}
      </div>
      ${envio && html`<p class="peq">Se suman los gastos de envío de cada súper y se respeta su pedido mínimo. Ajusta las tarifas de tu zona en <button class="enlace-btn" onClick=${() => ir("ajustes")}>Ajustes</button>.</p>`}
    </section>
    ${!plan ? html`<div class="vacio"><p>${envio ? "Ninguno de los supermercados elegidos lleva la compra a casa. Activa alguno o elige «Voy a la tienda»." : "Elige al menos un supermercado."}</p></div>` : html`<section class="seccion" aria-live="polite">
      <div class="tarjeta total">
        <span class="peq">${grupos.length === 1 ? `Toda la compra en ${C.tiendas[grupos[0].s]}` : `Repartiendo entre ${grupos.map(g => C.tiendas[g.s]).join(" y ")}`}${envio ? ", con envío a casa" : ""}</span>
        <span class="cifra">${fmt(plan.total)}</span>
        ${envio && html`<span class="peq">${fmt(plan.productos)} en productos + ${plan.gastos ? fmt(plan.gastos) + " de envío" : "envío gratis"}</span>`}
        ${ahorro >= 0.01 && html`<span class="etq">${Icono.etiqueta} Ahorras ${fmt(ahorro)} frente a todo en ${C.tiendas[r.mejorUna.conj[0]]}</span>`}
        ${ahorro < 0.01 && plan.usadas.length === 1 && r.mejor && r.mejor.usadas.length === 1 && html`<span class="peq">Repartir la compra no sale más barato${envio ? " con los gastos de envío" : ""}: ${C.tiendas[plan.usadas[0]]} es lo mejor para tu lista.</span>`}
        ${extra >= 0.5 && html`<span class="aviso-plan">Repartiendo entre ${r.mejor.usadas.map(s => C.tiendas[s]).join(" y ")} ahorrarías ${fmt(extra)} más.
          <button class="btn peq-btn" onClick=${() => cambiar(e => ({ ...e, max: 4 }))}>Repartir así</button></span>`}
        ${otroAhorro >= 0.5 && html`<span class="aviso-plan">${envio ? `Yendo a la tienda te ahorras ${fmt(otroAhorro)}` : `Con envío a casa pagarías ${fmt(otroAhorro)} menos`}${otro.plan ? ` (${otro.plan.usadas.map(s => C.tiendas[s]).join(" + ")})` : ""}.
          <button class="btn sec peq-btn" onClick=${() => cambiar(e => ({ ...e, envio: !envio }))}>${envio ? "Ver en tienda" : "Ver con envío"}</button></span>`}
        ${plan.cortos.length > 0 && html`<span class="peq aviso">No llegas al pedido mínimo de ${plan.cortos.map(s => C.tiendas[s]).join(" y ")}.</span>`}
        ${plan.faltan.length > 0 && html`<span class="peq">No hemos encontrado ${plan.faltan.length === 1 ? "1 producto" : plan.faltan.length + " productos"} en estos supermercados: ${plan.faltan.map(o => o.it.n).join(", ")}.</span>`}
      </div>
      ${grupos.map(g => html`<${GrupoTienda} key=${g.s} C=${C} g=${g} plan=${plan} envio=${envio} abrir=${abrir} copiar=${copiar} />`)}
      <${Escenarios} C=${C} r=${r} otro=${otro} estado=${estado} cambiar=${cambiar} />
      <p class="peq">«Llenar carrito» usa tu marcador del navegador en la web de cada súper: así entra con tu sesión y añade toda la cesta de golpe. LIDL no vende alimentación online: llévate su lista a la tienda.</p>
    </section>`}
    ${r && html`<section class="seccion" aria-labelledby="rk-tit"><h2 class="h2" id="rk-tit">Todo en un solo súper</h2>
      <ol class="ranking tarjeta">${[...r.unaTienda].sort((a, b) => a.sinEnvio - b.sinEnvio || a.faltan.length - b.faltan.length || a.total - b.total).map(x => html`<li key=${x.conj[0]} class=${r.mejorUna && x.conj[0] === r.mejorUna.conj[0] ? "mejor" : ""}>
        <${Logo} C=${C} s=${x.conj[0]} t=${36} />
        <div style=${{ minWidth: 0 }}><b translate="no">${C.tiendas[x.conj[0]]}</b>
          <div class="peq">${x.sinEnvio ? "No lleva la compra a casa" : x.faltan.length ? `Faltan ${x.faltan.length}: ${x.faltan.map(o => o.it.n).join(", ")}` : "Tiene toda tu lista"}</div>
          ${envio && !x.sinEnvio && html`<div class="peq">${x.gastos ? `Incluye ${fmt(x.gastos)} de envío` : "Envío gratis"}${x.cortos.length ? " · no llega al pedido mínimo" : ""}</div>`}</div>
        <span class="cifra">${x.sinEnvio ? "—" : fmt(x.total)}</span></li>`)}</ol>
      <p class="peq">Si un súper no tiene el producto exacto, se usa el más barato del mismo tipo y tamaño parecido${AJ.saludable ? ", dando prioridad al más saludable" : ""}.</p></section>`}
  </div>`;
}

/* ------------------------------------------------------------------ ajustes */
function Ajustes({ C, estado, cambiar }) {
  const aj = mezclarAjustes(estado.ajustes);
  const fijar = cambio => cambiar(e => ({ ...e, ajustes: { ...mezclarAjustes(e.ajustes), ...cambio } }));
  const fijarEnvio = (s, campo, valor) => cambiar(e => {
    const a = mezclarAjustes(e.ajustes);
    return { ...e, ajustes: { ...a, envios: a.envios.map((x, i) => i === s ? { ...x, [campo]: valor } : x) } };
  });
  const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) && n >= 0 ? n : 0; };
  const campo = (s, k, etiqueta, valor) => html`<label class="campo"><span>${etiqueta}</span>

      placeholder="Sin umbral…" onChange=${ev => fijarEnvio(s, k, ev.target.value === "" ? null : num(ev.target.value))} /> €</span></label>`;

        <${Interruptor} id="aj-socio" activo=${aj.socio} cambiar=${v => fijar({ socio: v })} titulo=${html`<${Logo} C=${null} s=${1} t=${22} /> Soy socio de Consum`}
          texto="Resta del precio de Consum lo que acumulas en tu Cheque Crece con los productos en promoción. Lo recibes en tu próximo cheque regalo, no en caja." />

      <div class="tarjeta" style=${{ padding: 16 }}><${Marcador} /></div>

    <section class="seccion" aria-labelledby="env-tit"><h2 class="h2" id="env-tit">Envío a domicilio</h2>
      <p class="peq">Tarifas publicadas por cada cadena. Cambian según el código postal: corrígelas si en tu zona son otras.</p>
      <div class="tarjeta grupo-ios">${C.tiendas.map((t, s) => {
        const e = aj.envios[s];

          <${Interruptor} id=${`env-${s}`} activo=${e.activo} cambiar=${v => fijarEnvio(s, "activo", v)} titulo=${html`<${Logo} C=${null} s=${s} t=${26} /><span translate="no">${t}</span>`}
            texto=${e.activo ? "Lleva la compra a tu zona" : s === 3 ? "LIDL no lleva la compra de alimentación a casa" : "No se tiene en cuenta para envíos"} />
          ${e.activo && html`<div class="campos">
            ${campo(s, "coste", "Gastos de envío", e.coste)}
            ${campo(s, "minimo", "Pedido mínimo", e.minimo)}

            ${campo(s, "costeSobre", "el envío cuesta", e.costeSobre)}
          </div>`}

      })}</div>
      <button class="btn sec" onClick=${() => fijar({ envios: ENVIOS_DEF })}>Restablecer tarifas</button>

        <div class="super-fila">${C.tiendas.map((t, s) => html`<${Logo} key=${t} C=${C} s=${s} t=${36} />`)}</div>
        <p class="peq">Precios de las webs de Mercadona, Consum, DIA y LIDL, actualizados cada mañana. Los de Mercadona son los de su almacén de Valencia; los de las demás cadenas, los que muestra su web por defecto. LIDL solo publica online una parte de su surtido.</p>
      </div>
